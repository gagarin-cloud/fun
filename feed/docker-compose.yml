services:
  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - api

  api:
    build: ./api
    environment:
      - DATABASE_URL=postgres://gagarin:gagarin@db:5432/gagarin
      - PORT=4000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=gagarin
      - POSTGRES_PASSWORD=gagarin
      - POSTGRES_DB=gagarin
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gagarin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
