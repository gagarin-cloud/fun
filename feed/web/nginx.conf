# First line of defence, so floods die before they reach node or postgres.
# The real client is the left-most address gagarin's ingress recorded.
map $http_x_forwarded_for $client_ip {
  default               $remote_addr;
  "~^(?<first>[^,\s]+)" $first;
}

# An empty key disables the zone, so only writes land in the write bucket.
map $request_method $write_key {
  default "";
  POST    $client_ip;
}

limit_req_zone  $client_ip zone=reads:10m  rate=120r/m;
limit_req_zone  $write_key zone=writes:10m rate=20r/m;
limit_conn_zone $client_ip zone=conns:10m;

server {
  listen 8080;
  root /site;
  index index.html;

  server_tokens off;
  client_max_body_size 8k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  limit_conn conns 20;
  limit_req_status 429;
  limit_conn_status 429;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  # The hashes cover the two inline blocks in index.html: the Pager queue stub
  # and the JSON-LD graph. Recompute them if either block changes.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://pager.grabthe.email; style-src 'self'; script-src 'self' https://pager.grabthe.email 'sha256-MB5qwXEWtCAAxVGYCWi6PRfxiXVZhICBWYgjzs9ByzY=' 'sha256-91DF09dhRfHHA7vLLDRhE9kq7HoWPn3wa30HHTSJvfQ='; connect-src 'self' https://pager.grabthe.email; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location /api/ {
    limit_except GET HEAD POST { deny all; }
    limit_req zone=reads  burst=40 nodelay;
    limit_req zone=writes burst=5  nodelay;

    proxy_pass http://api:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
  }

  # Machine-readable files, served as text so an agent can just read them.
  location = /llms.txt { default_type text/plain; charset utf-8; }
  location = /api.md   { default_type text/markdown; charset utf-8; }

  location / {
    try_files $uri $uri/ =404;
  }
}
