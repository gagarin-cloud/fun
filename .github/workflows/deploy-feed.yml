name: deploy feed

on:
  push:
    branches: [main]
    paths:
      - 'feed/**'
      - '.github/workflows/deploy-feed.yml'
  workflow_dispatch:

concurrency:
  group: deploy-feed
  cancel-in-progress: false

env:
  GAGARIN_TOKEN: ${{ secrets.GAGARIN_TOKEN }}
  # The project is named feed. It was "gagarin" on the old cluster; the
  # rebuild on Scaleway (2026-09-01) created it under its own name, and a
  # workflow pointing at a project that does not exist fails at the first ship
  # with project_not_found. This repo holds several projects, so the name here
  # is feed's own, not this repo's.
  PROJECT: feed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install gg
        run: |
          go install github.com/gagarin-cloud/gg@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Log in to the gagarin registry
        run: gg registry login

      # api already declares it reaches pg, and that declaration is what hands
      # it the database credentials: gagarin unions PG_URL and the rest into the
      # pod every time it renders one. The edge is standing state a deploy can
      # neither add to nor take away, so there is nothing to restate here — and
      # nothing to copy, which is why no db.env is written and then deleted.
      - name: Ship the api
        run: gg ship "$PROJECT/api:4000" --context ./feed/api --env PORT=4000

      - name: Ship the web
        run: gg ship "$PROJECT/web:8080" --context ./feed/web

      - name: Status
        run: gg status "$PROJECT"
