services:
  bot:
    build:
      context: .
    image: insider-bot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # The database lives on the host bind mount below, not in the image.
      DB_PATH: /data/insider.sqlite
      # Pinned so the cron schedules mean the same thing on every host.
      TZ: UTC
      NODE_ENV: production
    volumes:
      # Host bind mount, deliberately not a named volume: ./data/insider.sqlite is
      # openable directly in a local SQLite browser for inspecting calls and tuning
      # prompts, and it survives `docker compose down -v`.
      #
      # No chown needed. docker-entrypoint.sh runs as root just long enough to fix
      # ownership of this mount, then drops to the `node` user before starting the
      # app — a mount replaces the image's own directory permissions, which is what
      # caused a SQLITE_CANTOPEN crash-loop before the entrypoint existed.
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # SQLite in WAL mode wants a real filesystem; a tmpfs or network share will
    # corrupt or lock. ./data on the VM's local disk is correct.
    stop_grace_period: 20s
